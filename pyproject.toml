[project]
name = "clumpy-workspace"
version = "0.1.0"
description = "Workspace for clumpy LUCC modeling packages"
requires-python = ">=3.10"
dependencies = [
    # the three packages of this repository; they bring their own dependencies
    "clumpy",
    "ekde",
    "hyperclip",
    # the Cython extensions of ekde and hyperclip need the NumPy 1.x C API
    "numpy>=1.19.2,<2.0",
    # imported by the scripts directly
    "scipy",
    "scikit-learn",
]

[tool.uv.sources]
ekde = { path = "ekde" }
hyperclip = { path = "hyperclip" }
clumpy = { path = "clumpy" }

[tool.uv.extra-build-dependencies]
ekde = ["numpy<2.0", "cython"]
hyperclip = ["numpy<2.0", "cython"]
